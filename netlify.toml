# Configuration Netlify pour StockPro (frontend uniquement)

[build]
  command = "npm run build"
  publish = "dist"

# 1) Les appels /api sont envoyés vers l'API hébergée sur Render
#    (remplace l'URL par celle de ton service Render)
[[redirects]]
  from = "/api/*"
  to = "https://stockpro-api.onrender.com/api/:splat"
  status = 200
  force = true

# 2) Redirection SPA : toutes les autres routes renvoient vers index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# En-têtes HTTP de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"

# Cache long pour les assets générés avec hash (CSS/JS)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
